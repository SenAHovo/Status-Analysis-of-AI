name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/audit_secrets.py --mode public
      - run: git diff --check
